# migrate-v2.yml — apply the committed migrations (drizzle/) to the Neon
# branch `v2`, only when a human presses the button (ADR-0004, ADR-0057).
# 1) encrypted backup first, kept 90 days; 2) migrate; 3) re-run the PRs'
# migration gates (ci.yml) that waited for it. (v1's migrate.yml retired 6 Nov.)
# Run it: Actions -> migrate-v2 -> Run workflow -> type "migrate v2".
name: migrate-v2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate v2" to confirm'
        required: true

permissions:
  contents: read
  actions: write # re-run the PRs' migration gates afterwards

jobs:
  migrate:
    if: github.event.inputs.confirm == 'migrate v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Its own environment: the database's secret is scoped to this job.
    environment: v2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install pg_dump 18 and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 age
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: 1. Backup before touching anything
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
          PGSSLROOTCERT: system
        run: scripts/backup.sh out

      - uses: actions/upload-artifact@v7
        with:
          name: pre-migration-backup-v2-${{ github.run_id }}
          path: out/*.dump.age
          retention-days: 90
          if-no-files-found: error

      - name: 2. Apply committed migrations (drizzle/*.sql)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        run: npx drizzle-kit migrate

      - name: Show applied migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
          PGSSLROOTCERT: system
        run: psql "$DATABASE_URL" -c "select id, hash, to_timestamp(created_at/1000) as generated from drizzle.__drizzle_migrations order by id"

      # The PRs waiting for this migration: their CI failed at the migration
      # gate; re-run the failed jobs so they pass now (ci.yml finds this run).
      - name: Re-run the waiting migration gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --event pull_request --status failure --limit 20 --json databaseId -q '.[].databaseId'); do
            gh run rerun "$id" --failed --repo "$GITHUB_REPOSITORY" || true
          done
