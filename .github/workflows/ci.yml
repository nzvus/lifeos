# .github/workflows/ci.yml — the checks every push and pull request must pass
# (ADR-0004). Branch protection on `main` requires this workflow to be green,
# so nothing reaches production without it (docs/runbooks/setup.md step 6).
#
# Order: cheapest checks first, so a failure is reported as early as possible.
# No secrets are used: tests run on PGlite (in-process Postgres), and the build
# doesn't need DATABASE_URL because every page is rendered per request.
name: ci

on:
  # Push: only main (after a merge). Other branches are checked through their
  # pull request; triggering on every push too ran CI twice per PR.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read # least privilege: CI only reads the code
  actions: read # the migration gate reads migrate.yml's runs

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the migration gate diffs against the PR's base

      # Deploy happens on merge, production migrations only by hand
      # (migrate.yml), so a PR with a new migration must not be merged before
      # production has it: the code would query what doesn't exist yet
      # (outages of 2026-09-30, PR #22, and 2026-10-01, PR #103 — that one
      # had the "production-migrated" label, set by hand without the run).
      # So the gate trusts no label: it passes only if a SUCCESSFUL migrate.yml
      # run used a commit that contains every new migration file of this PR.
      # migrate.yml re-runs the failed gates when it finishes.
      - name: Migration gate
        if: github.event_name == 'pull_request'
        shell: bash # process substitution <(…)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare with the base branch as it is NOW (a migration merged
          # since the PR was opened is not new any more, #38).
          git fetch --quiet origin "$BASE_REF"
          new=$(comm -13 \
            <(git ls-tree --name-only "origin/$BASE_REF" drizzle/ | grep '\.sql$' | sort) \
            <(git ls-tree --name-only HEAD drizzle/ | grep '\.sql$' | sort))
          if [ -z "$new" ]; then echo "No new migration."; exit 0; fi
          echo "New migration(s): $new"
          for sha in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow migrate.yml \
              --status success --limit 50 --json headSha -q '.[].headSha'); do
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --quiet origin "$sha" 2>/dev/null || continue
            have=$(git ls-tree --name-only "$sha" drizzle/ | grep '\.sql$' | sort)
            if [ -z "$(comm -23 <(echo "$new") <(echo "$have"))" ]; then
              echo "Production was migrated by migrate.yml from $sha."; exit 0
            fi
          done
          echo "::error::This PR adds a migration production doesn't have. Run: gh workflow run migrate.yml --ref ${{ github.head_ref }} -f confirm=\"migrate production\" — this check re-runs by itself when it succeeds."
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm # reuse downloaded packages between runs

      # `npm ci` installs EXACTLY what package-lock.json says (never updates it).
      - run: npm ci

      - name: Docs guardrail (template health check)
        run: python3 scripts/check.py

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes ADR-0002 boundary rules)
        run: npm run lint

      - name: Tests (includes cross-user isolation and snapshot tests)
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
