# .github/workflows/ci.yml — the checks every push and pull request must pass
# (ADR-0004). Branch protection on `main` requires this workflow to be green,
# so nothing reaches production without it (docs/runbooks/setup.md step 6).
#
# Order: cheapest checks first, so a failure is reported as early as possible.
# No secrets are used: tests run on PGlite (in-process Postgres), and the build
# doesn't need DATABASE_URL because every page is rendered per request.
name: ci

on:
  # Push: only main (after a merge). Other branches are checked through their
  # pull request; triggering on every push too ran CI twice per PR.
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled too: adding "production-migrated" re-runs the gate.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read # least privilege: CI only reads the code

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the migration gate diffs against the PR's base

      # Deploy happens on merge, production migrations only by hand
      # (migrate.yml), so a PR with a new migration must not be merged before
      # production has it: the code would query columns that don't exist yet
      # (outage of 2026-09-30, PR #22). Run migrate.yml on the PR branch,
      # then add the label "production-migrated"; this re-runs and passes.
      - name: Migration gate
        if: github.event_name == 'pull_request'
        shell: bash # process substitution <(…)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          # Compare with the base branch as it is NOW, not as it was when the
          # PR was opened: a PR stacked on one that added a migration must not
          # count that migration as new once it is merged (#38, 2026-09-30).
          # "New" = migration files in this PR that the base branch doesn't have.
          git fetch --quiet origin "$BASE_REF"
          new=$(comm -13 \
            <(git ls-tree --name-only "origin/$BASE_REF" drizzle/ | grep '\.sql$' | sort) \
            <(git ls-tree --name-only HEAD drizzle/ | grep '\.sql$' | sort))
          if [ -z "$new" ]; then echo "No new migration."; exit 0; fi
          echo "New migration(s): $new"
          if echo "$LABELS" | grep -q '"production-migrated"'; then
            echo "Label production-migrated present."
          else
            echo "::error::This PR adds a migration. Run: gh workflow run migrate.yml --ref ${{ github.head_ref }} -f confirm=\"migrate production\" — then add the label production-migrated."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm # reuse downloaded packages between runs

      # `npm ci` installs EXACTLY what package-lock.json says (never updates it).
      - run: npm ci

      - name: Docs guardrail (template health check)
        run: python3 scripts/check.py

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes ADR-0002 boundary rules)
        run: npm run lint

      - name: Tests (includes cross-user isolation and snapshot tests)
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
