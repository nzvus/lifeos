# .github/workflows/ci.yml — the checks every push and pull request must pass
# (ADR-0004). Branch protection on `main` requires this workflow to be green,
# so nothing reaches production without it (docs/runbooks/setup.md step 6).
#
# Four jobs side by side (2026-10-04: one job in a row took 5 minutes):
# static checks, tests, build, kit photos. `check` waits for them and holds the migration
# gate; it is the status branch protection requires, so its name stays.
# No secrets are used: tests run on PGlite (in-process Postgres), and the build
# doesn't need DATABASE_URL because every page is rendered per request.
name: ci

on:
  # Push: only main (after a merge). Other branches are checked through their
  # pull request; triggering on every push too ran CI twice per PR.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read # least privilege: CI only reads the code
  actions: read # the migration gate reads migrate-v2.yml's runs

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm # reuse downloaded packages between runs
      # `npm ci` installs EXACTLY what package-lock.json says (never updates it).
      - run: npm ci
      - name: Docs guardrail (template health check)
        run: python3 scripts/check.py
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (includes ADR-0002 boundary rules)
        run: npm run lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The migrations run once (core/testing/global-setup.ts); each test
      # database is a copy of that one.
      - name: Tests (includes cross-user isolation and snapshot tests)
        run: npm test

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Next's build cache between runs: only what changed is compiled again.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      # With no secret, as Vercel builds a preview: a page that reads the
      # environment before requireOwner() is prerendered and breaks it (6 Nov).
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # The kit gallery photographed against the committed images (PAT-94,
  # docs/runbooks/ui-audit.md): a production build on PGlite, no secret.
  kit-shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Kit photos (PAT-94)
        run: npm run shots
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kit-shots
          path: test-results/

  check:
    needs: [static, test, build, kit-shots]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the migration gate diffs against the PR's base

      # Deploy happens on merge, production migrations only by hand
      # (migrate-v2.yml), so a PR with a new migration must not be merged before
      # production has it: the code would query what doesn't exist yet
      # (v1's outages of 2026-09-30, PR #22, and 2026-10-01, PR #103 — that one
      # had the "production-migrated" label, set by hand without the run).
      # So the gate trusts no label: it passes only if a SUCCESSFUL migrate-v2.yml
      # run used a commit that contains every new migration file of this PR.
      # migrate-v2.yml re-runs the failed gates when it finishes.
      - name: Migration gate
        if: github.event_name == 'pull_request'
        shell: bash # process substitution <(…)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare with the base branch as it is NOW (a migration merged
          # since the PR was opened is not new any more, #38).
          git fetch --quiet origin "$BASE_REF"
          # By file name, in drizzle/ or (before 6 Nov, when v2 lived there) apps/v2/drizzle/.
          sqls() { git ls-tree --name-only "$1" drizzle/ apps/v2/drizzle/ | grep '\.sql$' | sed 's|.*/||' | sort -u; }
          new=$(comm -13 <(sqls "origin/$BASE_REF") <(sqls HEAD))
          if [ -z "$new" ]; then echo "No new migration."; exit 0; fi
          echo "New migration(s): $new"
          for sha in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow migrate-v2.yml \
              --status success --limit 50 --json headSha -q '.[].headSha'); do
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --quiet origin "$sha" 2>/dev/null || continue
            have=$(sqls "$sha")
            if [ -z "$(comm -23 <(echo "$new") <(echo "$have"))" ]; then
              echo "Production was migrated by migrate-v2.yml from $sha."; exit 0
            fi
          done
          echo "::error::This PR adds a migration production doesn't have. Run: gh workflow run migrate-v2.yml --ref ${{ github.head_ref }} -f confirm=\"migrate v2\" — this check re-runs by itself when it succeeds."
          exit 1
